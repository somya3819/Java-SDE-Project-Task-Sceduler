    <script>
        // IMPORTANT: Reverted to the full URL. This will only work if you follow the instructions above.
        const API_URL = 'http://localhost:8080/api/jobs'; 
        const jobListBody = document.getElementById('job-list');
        const createJobForm = document.getElementById('create-job-form');
        const formMessage = document.getElementById('form-message');
        const loadingMessage = document.getElementById('loading-message');
        const refreshBtn = document.getElementById('refresh-btn');

        // Function to get a nice-looking status badge
        function getStatusBadge(status) {
            if (!status) return '';
            const statusClass = `status-${status.toLowerCase()}`;
            return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">${status}</span>`;
        }

        // Function to format date and time
        function formatDateTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // Function to fetch and display jobs
        async function fetchJobs() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`API server not reachable. Status: ${response.status}`);
                }
                const jobs = await response.json();
                
                jobListBody.innerHTML = ''; // Clear existing list or loading message

                if (jobs.length === 0) {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td colspan="5" class="text-center p-8 text-gray-500">Koi jobs nahi mile. Shuru karne ke liye ek banayein!</td>`;
                    jobListBody.appendChild(row);
                } else {
                    jobs.sort((a, b) => b.id - a.id); // Show newest jobs first
                    jobs.forEach(job => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${job.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${job.title}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">${getStatusBadge(job.status)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDateTime(job.scheduledTime)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDateTime(job.createdAt)}</td>
                        `;
                        jobListBody.appendChild(row);
                    });
                }
            } catch (error) {
                console.error('Error fetching jobs:', error);
                jobListBody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-red-600">Error: API server se connect nahi ho pa raha. Kya server chal raha hai?</td></tr>`;
            }
        }

        // Function to handle form submission
        createJobForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formMessage.textContent = '';
            formMessage.className = 'mt-4 text-sm';

            const formData = new FormData(createJobForm);
            const localTime = formData.get('scheduledTime');
            // Ensure the time is sent in a format the backend expects
            const isoTime = new Date(localTime).toISOString().slice(0, 19);

            const jobData = {
                title: formData.get('title'),
                description: formData.get('description'),
                scheduledTime: isoTime,
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(jobData),
                });

                if (!response.ok) {
                    throw new Error('Failed to create job.');
                }

                formMessage.textContent = 'Job safaltapoorvak ban gaya!';
                formMessage.classList.add('text-green-600');
                createJobForm.reset();
                fetchJobs(); // Refresh the list
            } catch (error) {
                console.error('Error creating job:', error);
                formMessage.textContent = 'Error: Job nahi ban paaya. Kya API server chal raha hai?';
                formMessage.classList.add('text-red-600');
            }
        });
        
        refreshBtn.addEventListener('click', fetchJobs);

        fetchJobs();
        setInterval(fetchJobs, 5000); 
    </script>
